name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build publication artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo '.release-deps/' >> .git/info/exclude
      - uses: actions/checkout@v6
        with:
          repository: pioneerjeff-labs/emotion-engine
          ref: 48e6f3fff767209e3d96721935e5476734e740a4
          path: .release-deps/emotion-engine
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: python -m pip install -e '.[test]' build twine
      - run: scripts/release-gate.sh --build-only --emotion-engine-source "$GITHUB_WORKSPACE/.release-deps/emotion-engine" --output-dir "$RUNNER_TEMP/packwright-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            ${{ runner.temp }}/packwright-dist/*.whl
            ${{ runner.temp }}/packwright-dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/packwright-dist/release-artifacts.json
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/packwright
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  receipt:
    name: Attach publication receipt
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: publication-receipt
          path: receipt
      - name: Attach checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" receipt/release-artifacts.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: Summarize publication receipt
        run: |
          {
            echo "### Published artifacts"
            echo
            echo 'The exact PyPI artifact receipt is attached to this GitHub Release as `release-artifacts.json`.'
            echo
            echo '```json'
            cat receipt/release-artifacts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
